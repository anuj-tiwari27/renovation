<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" fill="none" role="img" aria-label="CT Elite Remodel">
  <defs>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6dc7c" />
      <stop offset="45%" stop-color="#d4a73d" />
      <stop offset="100%" stop-color="#9c7416" />
    </linearGradient>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6dc7c" />
      <stop offset="100%" stop-color="#c9a437" />
    </linearGradient>
  </defs>
  <!-- Back (larger) roof, hollow with gold outline -->
  <path d="M 30 90 L 110 22 L 190 90 Z"
        fill="#0b0b0b"
        stroke="url(#goldStroke)"
        stroke-width="6"
        stroke-linejoin="round" />
  <!-- Chimney -->
  <rect x="160" y="36" width="9" height="22" fill="url(#goldFill)" />
  <!-- Front (smaller) roof -->
  <path d="M 10 90 L 70 42 L 130 90 Z"
        fill="#0b0b0b"
        stroke="url(#goldStroke)"
        stroke-width="6"
        stroke-linejoin="round" />
  <!-- Baseline swoosh -->
  <path d="M 4 94 Q 100 116 196 94"
        fill="none"
        stroke="url(#goldStroke)"
        stroke-width="4"
        stroke-linecap="round" />
  <!-- Big-house window (2x2 grid) -->
  <g transform="translate(98 56)">
    <rect width="24" height="24" fill="url(#goldFill)" />
    <line x1="12" y1="0" x2="12" y2="24" stroke="#0b0b0b" stroke-width="2.5" />
    <line x1="0" y1="12" x2="24" y2="12" stroke="#0b0b0b" stroke-width="2.5" />
  </g>
  <!-- Small-house window -->
  <g transform="translate(58 66)">
    <rect width="18" height="18" fill="url(#goldFill)" />
    <line x1="9" y1="0" x2="9" y2="18" stroke="#0b0b0b" stroke-width="2" />
    <line x1="0" y1="9" x2="18" y2="9" stroke="#0b0b0b" stroke-width="2" />
  </g>
  <!-- Sparkle accents -->
  <g fill="#fff7d3" opacity="0.9">
    <path d="M 110 18 l 1.4 3 l 3 1.4 l -3 1.4 l -1.4 3 l -1.4 -3 l -3 -1.4 l 3 -1.4 z" />
    <path d="M 70 38 l 1 2 l 2 1 l -2 1 l -1 2 l -1 -2 l -2 -1 l 2 -1 z" />
    <path d="M 150 80 l 1 2 l 2 1 l -2 1 l -1 2 l -1 -2 l -2 -1 l 2 -1 z" />
  </g>
</svg>
