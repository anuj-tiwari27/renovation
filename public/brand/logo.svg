<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="CT Elite Remodel">
  <defs>
    <linearGradient id="lg-goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6dc7c" />
      <stop offset="45%" stop-color="#d4a73d" />
      <stop offset="100%" stop-color="#9c7416" />
    </linearGradient>
    <linearGradient id="lg-goldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6dc7c" />
      <stop offset="100%" stop-color="#c9a437" />
    </linearGradient>
  </defs>
  <!-- Roof mark on the left -->
  <g transform="translate(20 30) scale(0.78)">
    <path d="M 30 90 L 110 22 L 190 90 Z" fill="#0b0b0b" stroke="url(#lg-goldStroke)" stroke-width="6" stroke-linejoin="round" />
    <rect x="160" y="36" width="9" height="22" fill="url(#lg-goldFill)" />
    <path d="M 10 90 L 70 42 L 130 90 Z" fill="#0b0b0b" stroke="url(#lg-goldStroke)" stroke-width="6" stroke-linejoin="round" />
    <path d="M 4 94 Q 100 116 196 94" fill="none" stroke="url(#lg-goldStroke)" stroke-width="4" stroke-linecap="round" />
    <g transform="translate(98 56)">
      <rect width="24" height="24" fill="url(#lg-goldFill)" />
      <line x1="12" y1="0" x2="12" y2="24" stroke="#0b0b0b" stroke-width="2.5" />
      <line x1="0" y1="12" x2="24" y2="12" stroke="#0b0b0b" stroke-width="2.5" />
    </g>
    <g transform="translate(58 66)">
      <rect width="18" height="18" fill="url(#lg-goldFill)" />
      <line x1="9" y1="0" x2="9" y2="18" stroke="#0b0b0b" stroke-width="2" />
      <line x1="0" y1="9" x2="18" y2="9" stroke="#0b0b0b" stroke-width="2" />
    </g>
  </g>
  <!-- Wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="url(#lg-goldFill)">
    <text x="220" y="125" font-size="84" font-weight="700" letter-spacing="6">CT ELITE</text>
    <text x="220" y="170" font-size="36" letter-spacing="14" font-weight="500">REMODEL</text>
  </g>
  <!-- Tag line -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#5b4a1c">
    <text x="220" y="205" font-size="18" letter-spacing="4" font-weight="500">KITCHEN · BATH · FULL HOME</text>
  </g>
</svg>
